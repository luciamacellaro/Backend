<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi Presentación Personal</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --lila:        #c084fc;
      --lila-claro:  #e9d5ff;
      --lila-oscuro: #7c3aed;
      --menta:       #6ee7b7;
      --menta-claro: #d1fae5;
      --menta-oscuro:#059669;
      --fondo:       #f5f0ff;
      --texto:       #2d1b4e;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif;
      background-color: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }
    body::before {
      content: '';
      position: fixed;
      top: -150px; right: -150px;
      width: 450px; height: 450px;
      background: radial-gradient(circle, var(--lila-claro), transparent 70%);
      border-radius: 50%;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -100px; left: -100px;
      width: 350px; height: 350px;
      background: radial-gradient(circle, var(--menta-claro), transparent 70%);
      border-radius: 50%;
      z-index: 0;
    }
    .tarjeta {
      position: relative;
      z-index: 1;
      background: white;
      border-radius: 32px;
      padding: 56px 48px;
      max-width: 640px;
      width: 100%;
      box-shadow: 0 4px 6px rgba(192,132,252,.08), 0 20px 60px rgba(192,132,252,.18);
      animation: aparecer .8s ease both;
    }
    @keyframes aparecer {
      from { opacity:0; transform:translateY(30px); }
      to   { opacity:1; transform:translateY(0); }
    }
    .avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--lila), var(--menta));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 2rem; color: white;
      margin-bottom: 28px;
      box-shadow: 0 8px 20px rgba(192,132,252,.4);
    }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 3.4rem);
      font-weight: 900;
      line-height: 1.1;
      background: linear-gradient(135deg, var(--lila-oscuro) 30%, var(--menta-oscuro));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
    }
    .separador {
      width: 60px; height: 4px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--lila), var(--menta));
      margin-bottom: 24px;
    }
    .descripcion {
      font-size: 1.05rem;
      font-weight: 300;
      line-height: 1.75;
      color: #5b4b72;
      margin-bottom: 40px;
    }
    .titulo-hobbies {
      font-size: .75rem;
      font-weight: 500;
      letter-spacing: .15em;
      text-transform: uppercase;
      color: var(--lila-oscuro);
      margin-bottom: 16px;
    }
    .hobbies { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .hobbies li {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px;
      border-radius: 14px;
      background: var(--fondo);
      border: 1.5px solid var(--lila-claro);
      font-size: 1rem;
      transition: transform .2s ease, box-shadow .2s ease;
      animation: entrar .6s ease both;
    }
    .hobbies li:nth-child(1) { animation-delay: .2s; }
    .hobbies li:nth-child(2) { animation-delay: .35s; }
    .hobbies li:nth-child(3) { animation-delay: .5s; }
    .hobbies li:nth-child(4) { animation-delay: .65s; }
    @keyframes entrar {
      from { opacity:0; transform:translateX(-16px); }
      to   { opacity:1; transform:translateX(0); }
    }
    .hobbies li:hover {
      transform: translateX(6px);
      box-shadow: 0 4px 14px rgba(110,231,183,.25);
      border-color: var(--menta);
    }
    .icono {
      font-size: 1.4rem;
      width: 40px; height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--lila-claro), var(--menta-claro));
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    footer {
      position: relative; z-index: 1;
      margin-top: 32px;
      font-size: .8rem;
      color: #a78fc0;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <div class="avatar">TN</div>
    <h1>Tu Nombre Acá</h1>
    <div class="separador"></div>
    <p class="descripcion">
      ¡Hola! Soy una persona curiosa y creativa que disfruta de la música,
      la cocina y los buenos libros. Me encanta aprender cosas nuevas
      y compartir experiencias con la gente que me rodea. 🌿
    </p>
    <p class="titulo-hobbies">Mis hobbies</p>
    <ul class="hobbies">
      <li><span class="icono">🎧</span> DJ</li>
      <li><span class="icono">🍳</span> Cocinar</li>
      <li><span class="icono">📚</span> Leer</li>
      <li><span class="icono">🏃</span> Correr</li>
    </ul>
  </div>
  <footer>Hecho con HTML &amp; CSS 💜</footer>
</body>
</html>
